<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Biotope</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <header>
      <h1>Digital Biotope</h1>
      <div id="readout" class="readout"></div>
    </header>

    <main>
      <section class="stage">
        <canvas id="grid"></canvas>
        <div class="transport">
          <label class="preset">
            構成
            <select id="preset"></select>
          </label>
          <button id="playPause" class="primary">停止</button>
          <button id="resetBtn">リセット</button>
          <label class="speed">
            速度 <span id="speedLabel">1x</span>
            <input id="speed" type="range" min="1" max="20" step="1" value="1" />
          </label>
          <label class="seed">
            シード
            <input id="seed" type="number" value="12345" />
          </label>
          <label class="layer">
            盤面
            <select id="layer">
              <option value="life">生物と草</option>
              <option value="grass">草だけ</option>
              <option value="terrain">地形（移動コスト）</option>
              <option value="patch">パッチ（草の回復）</option>
              <option value="detritus">死骸の在庫</option>
            </select>
          </label>
        </div>
        <p id="presetDesc" class="desc"></p>
      </section>

      <aside class="panel">
        <div class="card">
          <h2>
            個体数
            <label class="opt"><input id="logScale" type="checkbox" /> 対数軸</label>
          </h2>
          <canvas id="graph"></canvas>
        </div>

        <!-- 形質が遺伝する構成でだけ出す。平均では二山かどうかが原理的に見えない -->
        <div class="card" id="histCard" hidden>
          <h2>
            形質の分布
            <span class="opt" id="traitTabs"></span>
          </h2>
          <canvas id="hist"></canvas>
        </div>

        <div class="group" id="instruments"></div>
        <div id="controls"></div>
      </aside>
    </main>

    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
